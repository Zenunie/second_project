<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1>Task board</h1>
        <p class="subtitle">
          Capture your next task, then move it through each stage.
        </p>
      </header>

      <form class="task-composer" id="task-form">
        <div class="composer-copy">
          <label for="task-input">Add a new task</label>
          <span>What would you like to get done?</span>
        </div>
        <div class="composer-controls">
          <input
            type="text"
            id="task-input"
            class="task-input"
            placeholder="e.g. Prepare project outline"
            autocomplete="off"
          />
          <button class="add-btn" type="submit">Add task</button>
        </div>
      </form>

      <div class="board">
        <div class="list" id="list1">
          <div class="list-header">
            <span class="status-dot todo-dot"></span>
            <h2>To do</h2>
          </div>
          <div class="cards"></div>
        </div>

        <div class="list" id="list2">
          <div class="list-header">
            <span class="status-dot progress-dot"></span>
            <h2>In progress</h2>
          </div>
          <div class="cards"></div>
        </div>

        <div class="list" id="list3">
          <div class="list-header">
            <span class="status-dot done-dot"></span>
            <h2>Done</h2>
          </div>
          <div class="cards"></div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
